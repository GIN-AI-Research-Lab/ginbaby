<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBEEE8">
  <title>Kiểm tra ngoại tuyến · GinBaby</title>
  <style>
    :root { --bg:#FBEEE8; --card:#fff; --ink:#2B2634; --muted:#6F6470; --ok:#2f7a4f; --bad:#b3363f; --acc:#E5666F; --line:#E6CDC6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#3A3262; --card:#50478A; --ink:#FBF8FF; --muted:#E0D9F7; --ok:#8FE3C0; --bad:#FFA9BD; --acc:#9B7CF0; --line:#7468B0; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:max(20px, env(safe-area-inset-top)) 16px 40px; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    h1 { font-size:22px; margin:6px 0 4px; }
    p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
    .card { background:var(--card); border:1.2px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .k { color:var(--muted); } .v { font-weight:700; text-align:right; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    .big { font-size:17px; font-weight:800; margin-bottom:6px; }
    button, a.btn { display:block; width:100%; margin:8px 0 0; padding:13px; border-radius:14px; border:0; background:var(--acc); color:#fff; font:700 15px inherit; text-align:center; text-decoration:none; }
    button.alt { background:transparent; color:var(--ink); border:1.2px solid var(--line); }
    .bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; margin:8px 0 2px; }
    .bar > i { display:block; height:100%; width:0; background:var(--acc); transition:width .4s; }
    small { color:var(--muted); }
  </style>
</head>
<body>
  <h1>Kiểm tra chế độ ngoại tuyến</h1>
  <p class="sub">Trang này cho biết GinBaby đã được lưu đủ trong điện thoại để mở khi không có mạng chưa.</p>

  <div class="card"><div class="big" id="verdict">Đang kiểm tra…</div><div id="why"></div>
    <div class="bar"><i id="prog"></i></div><small id="progtxt"></small></div>

  <div class="card" id="rows"></div>

  <button id="warm">Lưu thêm ngay (cần có mạng)</button>
  <button id="reset" class="alt">Xoá bộ nhớ đệm và đăng ký lại</button>
  <a class="btn alt" href="./">Quay lại GinBaby</a>

<script>
const KEY_FILES = ['index.html', 'main.dart.js', 'flutter_bootstrap.js', 'canvaskit/canvaskit.wasm', 'assets/AssetManifest.bin', 'assets/assets/google_fonts/Inter-Regular.ttf'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

async function expected() {
  try {
    const t = await (await fetch('sw.js', { cache: 'no-store' })).text();
    const core = JSON.parse(/const CORE = (\[.*?\]);/s.exec(t)[1]);
    const rest = JSON.parse(/const REST = (\[.*?\]);/s.exec(t)[1]);
    return { core: core.length, rest: rest.length, stamp: /ginbaby-([^']+)'/.exec(t)[1], coreList: core, restList: rest };
  } catch (e) { return null; }
}

async function check() {
  const rows = [];
  const add = (k, v, cls) => rows.push('<div class="row"><span class="k">' + esc(k) + '</span><span class="v ' + (cls || '') + '">' + esc(v) + '</span></div>');
  const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  add('Đang mở dạng', standalone ? 'App trên Màn hình chính' : 'Trình duyệt (Safari)', standalone ? 'ok' : '');
  const hasSW = 'serviceWorker' in navigator;
  add('Trình duyệt hỗ trợ lưu ngoại tuyến', hasSW ? 'Có' : 'Không', hasSW ? 'ok' : 'bad');
  let reg = null, state = 'chưa đăng ký';
  if (hasSW) {
    reg = await navigator.serviceWorker.getRegistration();
    if (reg) state = reg.active ? 'đang hoạt động (' + reg.active.state + ')' : reg.installing ? 'đang cài' : reg.waiting ? 'đang chờ' : 'không rõ';
  }
  add('Bộ lưu ngoại tuyến (service worker)', state, reg && reg.active ? 'ok' : 'bad');
  add('Điều khiển trang này', hasSW && navigator.serviceWorker.controller ? 'Có' : 'Chưa (mở lại app một lần)', hasSW && navigator.serviceWorker.controller ? 'ok' : 'bad');

  const keys = await caches.keys();
  const mine = keys.filter((k) => k.startsWith('ginbaby-'));
  let have = 0, haveSet = new Set();
  if (mine.length) {
    const c = await caches.open(mine[mine.length - 1]);
    const reqs = await c.keys();
    have = reqs.length;
    reqs.forEach((r) => haveSet.add(new URL(r.url).pathname.replace(/^\//, '') || './'));
  }
  const exp = await expected();
  add('Bản đã lưu', mine.join(', ') || 'chưa có', mine.length ? 'ok' : 'bad');
  if (exp) add('Bản mới nhất trên máy chủ', 'ginbaby-' + exp.stamp, mine.includes('ginbaby-' + exp.stamp) ? 'ok' : 'bad');
  let coreOk = 0, restOk = 0;
  if (exp) {
    exp.coreList.forEach((u) => { if (haveSet.has(u === './' ? './' : u)) coreOk++; });
    exp.restList.forEach((u) => { if (haveSet.has(u)) restOk++; });
    add('Tệp cần để mở app', coreOk + '/' + exp.core, coreOk >= exp.core ? 'ok' : 'bad');
    const miss = exp.coreList.filter((u) => !haveSet.has(u));
    miss.forEach((u) => add('· THIẾU', u, 'bad'));
    add('Ảnh minh hoạ và phần phụ', restOk + '/' + exp.rest, restOk >= exp.rest ? 'ok' : '');
  } else {
    add('Tổng số tệp đã lưu', String(have), have > 0 ? 'ok' : 'bad');
    add('Máy chủ', 'Không tải được danh sách (đang mất mạng?)', 'bad');
  }
  KEY_FILES.forEach((f) => add('· ' + f.split('/').pop(), haveSet.has(f) ? 'đã lưu' : 'THIẾU', haveSet.has(f) ? 'ok' : 'bad'));
  try {
    const est = await navigator.storage.estimate();
    add('Dung lượng dùng / cho phép', Math.round(est.usage / 1e6) + ' MB / ' + Math.round(est.quota / 1e6) + ' MB');
    add('Được giữ cố định', (await navigator.storage.persisted()) ? 'Có' : 'Chưa');
  } catch (e) {}
  $('rows').innerHTML = rows.join('');

  const total = exp ? exp.core + exp.rest : 0;
  const got = coreOk + restOk;
  const pct = total ? Math.round(got * 100 / total) : 0;
  $('prog').style.width = pct + '%';
  $('progtxt').textContent = total ? got + '/' + total + ' tệp (' + pct + '%)' : '';
  const ready = reg && reg.active && exp && coreOk >= exp.core && KEY_FILES.every((f) => haveSet.has(f));
  const v = $('verdict'), w = $('why');
  if (ready) { v.textContent = 'Sẵn sàng chạy ngoại tuyến'; v.className = 'big ok'; w.textContent = restOk >= exp.rest ? 'Đã lưu đủ. Có thể tắt mạng để thử.' : 'Đủ để mở app. Ảnh minh hoạ vẫn đang được lưu nốt, giữ trang này mở thêm một lúc.'; }
  else { v.textContent = 'Chưa sẵn sàng'; v.className = 'big bad'; w.textContent = !hasSW ? 'Trình duyệt này không hỗ trợ.' : !reg ? 'Chưa có bộ lưu ngoại tuyến. Bấm "Xoá bộ nhớ đệm và đăng ký lại" khi đang có mạng.' : 'Còn thiếu tệp. Giữ mạng và bấm "Lưu thêm ngay".'; }
  return ready;
}

$('warm').onclick = async () => {
  const reg = await navigator.serviceWorker.getRegistration();
  if (reg) { await reg.update(); (reg.active || reg.waiting || reg.installing).postMessage({ type: 'warm' }); }
  $('why').textContent = 'Đang lưu… giữ trang này mở.';
};
$('reset').onclick = async () => {
  for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  for (const k of await caches.keys()) await caches.delete(k);
  const r = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  location.reload();
};

(async function loop() {
  try { await check(); } catch (e) { $('verdict').textContent = 'Lỗi: ' + e.message; }
  setTimeout(loop, 2500);
})();
</script>
</body>
</html>
