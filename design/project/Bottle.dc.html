<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>GinBaby – Bú bình</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
.lv{transition:transform .8s cubic-bezier(.22,1,.36,1)}
.wv{animation:wv 2.4s linear infinite}
.bub{animation:rs 3.2s ease-in infinite}
.b2{animation-delay:1.1s}
.b3{animation-delay:2.1s}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-70px)}}
@keyframes rs{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion: reduce){.wv,.bub{animation:none}.lv{transition:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#FBF5EC;color:#3B2F28;font-family:'Be Vietnam Pro',system-ui,sans-serif;box-sizing:border-box;padding:58px 20px 0">

<div style="display:flex;align-items:center;gap:12px">
<a href="Main.dc.html" aria-label="Quay lại" style="width:44px;height:44px;border-radius:22px;background:#FFFCF7;border:1px solid #EDE2D3;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="font-family:'Baloo 2',system-ui,sans-serif;font-weight:700;font-size:24px">Bú bình</div>
</div>

<div style="margin-top:14px;height:46px;border-radius:23px;background:#F1E7D8;padding:4px;box-sizing:border-box;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px">
<button onClick="{{ pickMom }}" style="border:0;border-radius:19px;font-size:14px;cursor:pointer;background:{{momBg}};color:{{momColor}};font-weight:{{momWeight}}">Sữa mẹ</button>
<button onClick="{{ pickFormula }}" style="border:0;border-radius:19px;font-size:14px;cursor:pointer;background:{{fmBg}};color:{{fmColor}};font-weight:{{fmWeight}}">Sữa công thức</button>
</div>

<div style="margin-top:12px;display:flex;align-items:center;gap:6px;height:340px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
<div style="font-size:13px;color:#6F5F53;font-weight:600">Bé uống</div>
<div style="display:flex;align-items:baseline;gap:4px">
<div style="font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums">{{ml}}</div>
<div style="font-size:18px;font-weight:700;color:#6F5F53">ml</div>
</div>
<div style="display:flex;gap:10px;margin-top:6px">
<button aria-label="Giảm 10ml" onClick="{{ minus }}" style="width:52px;height:52px;border-radius:26px;border:1px solid #CDBBA3;background:#FFFCF7;color:#3B2F28;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
<button aria-label="Tăng 10ml" onClick="{{ plus }}" style="width:52px;height:52px;border-radius:26px;border:0;background:#3B2F28;color:#FBF5EC;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
</div>
<div style="margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:#6F5F53;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hôm nay · 09:42</div>
</div>

<svg width="200" height="340" viewBox="0 0 240 340" role="img" aria-label="Bình sữa, mực sữa theo số ml" style="flex:none">
<defs>
<clipPath id="bodyClip"><rect x="52" y="102" width="136" height="226" rx="28"/></clipPath>
</defs>
<path d="M104 18 Q120 0 136 18 L142 52 H98 Z" fill="#EAD3B5" stroke="#3B2F28" stroke-width="2" stroke-linejoin="round"/>
<rect x="72" y="50" width="96" height="26" rx="10" fill="#3B2F28"/>
<rect x="84" y="76" width="72" height="34" fill="#FFFCF7" stroke="#3B2F28" stroke-width="2"/>
<rect x="50" y="100" width="140" height="230" rx="30" fill="#FFFCF7"/>
<g clip-path="url(#bodyClip)">
<g class="lv" style="transform:{{shiftT}}">
<rect x="40" y="110" width="160" height="240" fill="{{milkColor}}"/>
<g class="wv"><path d="M-20 110 q17.5 -9 35 0 t35 0 t35 0 t35 0 t35 0 t35 0 t35 0 t35 0 V124 H-20z" fill="{{milkColor}}"/></g>
<circle class="bub" cx="88" cy="312" r="4" fill="#FFFFFF"/>
<circle class="bub b2" cx="122" cy="318" r="3" fill="#FFFFFF"/>
<circle class="bub b3" cx="150" cy="308" r="5" fill="#FFFFFF"/>
</g>
</g>
<rect x="50" y="100" width="140" height="230" rx="30" fill="none" stroke="#3B2F28" stroke-width="2.5"/>
<g stroke="#3B2F28" stroke-width="2" stroke-linecap="round">
<path d="M170 275h16M170 220h16M170 165h16M170 110h16"/>
<path d="M178 302.5h8M178 247.5h8M178 192.5h8M178 137.5h8" stroke-width="1.5"/>
</g>
<g font-family="'Be Vietnam Pro',system-ui,sans-serif" font-size="11" font-weight="600" fill="#6F5F53">
<text x="196" y="279">60</text><text x="196" y="224">120</text><text x="196" y="169">180</text><text x="196" y="114">240</text>
</g>
</svg>
</div>

<div style="display:flex;gap:8px;justify-content:space-between">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{ c.pick }}" style="flex:1;height:44px;border-radius:22px;border:0;font-size:14.5px;cursor:pointer;background:{{c.bg}};color:{{c.color}};font-weight:{{c.weight}}">{{c.label}}</button>
</sc-for>
</div>

<sc-if value="{{isMom}}" hint-placeholder-val="{{ true }}">
<div style="margin-top:12px;background:#FFFCF7;border:1px solid #EDE2D3;border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px">
<svg width="34" height="40" viewBox="0 0 24 34" aria-hidden="true" style="flex:none"><path d="M9 3Q12 0 15 3L16 8H8Z" fill="#EAD3B5" stroke="#3B2F28" stroke-width="1.4" stroke-linejoin="round"/><rect x="6.5" y="8" width="11" height="4" rx="1.5" fill="#3B2F28"/><rect x="4" y="12" width="16" height="20" rx="4" fill="#FFFCF7" stroke="#3B2F28" stroke-width="1.6"/><rect x="5" y="15" width="14" height="16" rx="3" fill="#F8CBA4"/></svg>
<div style="flex:1;min-width:0">
<div style="font-size:12.5px;color:#6F5F53;font-weight:600">Lấy từ tủ sữa · bình 140ml, còn 2 ngày</div>
<div style="font-size:14.5px;font-weight:700;color:{{wasteColor}};margin-top:2px">{{wasteText}}</div>
</div>
</div>
</sc-if>

<button style="position:absolute;left:20px;right:20px;bottom:28px;height:56px;border:0;border-radius:28px;background:#3B2F28;color:#FBF5EC;font-size:17px;font-weight:700;cursor:pointer">Lưu · {{ml}}ml</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const ml = s.ml == null ? 120 : s.ml;
const type = s.type || 'mom';
const isMom = type === 'mom';
const shift = ((240 - ml) / 240) * 220;
const set = (v) => () => this.setState({ ml: v });
const wasteMl = Math.max(0, 140 - ml);
let wasteText = 'Uống hết bình, không đổ bỏ';
let wasteColor = '#4F6330';
if (ml < 140) { wasteText = 'Bé uống ' + ml + 'ml, đổ bỏ ' + wasteMl + 'ml'; wasteColor = '#B4561F'; }
if (ml > 140) { wasteText = 'Cần thêm ' + (ml - 140) + 'ml từ bình khác'; wasteColor = '#9A3F49'; }
return {
ml: ml,
isMom: isMom,
shiftT: 'translateY(' + shift + 'px)',
milkColor: isMom ? '#F8CBA4' : '#C9CFEE',
wasteText: wasteText,
wasteColor: wasteColor,
momBg: isMom ? '#3B2F28' : 'transparent',
momColor: isMom ? '#FBF5EC' : '#6F5F53',
momWeight: isMom ? 700 : 600,
fmBg: isMom ? 'transparent' : '#3B2F28',
fmColor: isMom ? '#6F5F53' : '#FBF5EC',
fmWeight: isMom ? 600 : 700,
pickMom: () => this.setState({ type: 'mom' }),
pickFormula: () => this.setState({ type: 'formula' }),
minus: () => this.setState({ ml: Math.max(0, ml - 10) }),
plus: () => this.setState({ ml: Math.min(240, ml + 10) }),
chips: [60, 90, 120, 150, 180].map((v) => ({
label: String(v),
pick: set(v),
bg: v === ml ? '#3B2F28' : '#F1E7D8',
color: v === ml ? '#FBF5EC' : '#3B2F28',
weight: v === ml ? 700 : 600
}))
};
}
}
</script>
</body>
</html>
